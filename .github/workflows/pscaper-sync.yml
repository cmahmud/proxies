name: Publish pscaper proxy pools

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pscaper-sync.yml'

permissions:
  contents: write

concurrency:
  group: pscaper-pool-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout existing proxy dataset
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download validated data from the pscaper VPS
        run: python3 scripts/sync_from_pscaper.py
      - name: Commit changed exports only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- alive/ gold/ historical/ stats.json
          if git diff --cached --quiet; then
            echo "No proxy data changes to publish"
            exit 0
          fi
          git commit -m "pscaper pool update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:main
